# Override for servers where an existing Traefik reverse proxy already owns ports 80/443.
# Traefik terminates HTTPS (Let's Encrypt) and forwards ${DOMAIN} to the web container,
# which then serves plain HTTP inside the Docker network and keeps the password prompt.
#
# Enable it by adding this line to .env:
#   COMPOSE_FILE=docker-compose.prod.yml:docker-compose.traefik.yml
services:
  web:
    ports: !reset []
    environment:
      SITE_ADDRESS: ":80"
    networks:
      - default
      - traefik
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK:-n8n-compose_default}
      traefik.http.routers.schaefers.rule: Host(`${DOMAIN}`)
      traefik.http.routers.schaefers.entrypoints: websecure
      traefik.http.routers.schaefers.tls: "true"
      traefik.http.routers.schaefers.tls.certresolver: ${TRAEFIK_CERTRESOLVER:-mytlschallenge}
      traefik.http.services.schaefers.loadbalancer.server.port: "80"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-n8n-compose_default}
