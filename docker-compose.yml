# Local development infrastructure. Credentials are placeholders for local use only.
services:
  postgres:
    image: postgres:16-alpine
    container_name: quotation-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quotation}
      POSTGRES_USER: ${POSTGRES_USER:-quotation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
